[tool.poetry]
name = "melonmind"
version = "0.1.0"
description = "Django backend with LangChain/LangGraph agents and Mulves knowledge base for network engineering operations"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
django = "^5.1"
djangorestframework = "^3.15.0"
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
# mulves 依赖需要根据实际包名调整
# mulves = "^1.0.0"
psycopg2-binary = "^2.9.7"
python-dotenv = "^1.0.0"
celery = "^5.3.0"
redis = "^4.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-django = "^4.5.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"